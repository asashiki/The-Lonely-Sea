      const selectedResponse=await nativeFetch(selectedUrl,{cache:"no-store"});
      if(!selectedResponse.ok)throw new Error("Launch scene could not be loaded");
      const selectedScript=String(launch.prelude||"")+await selectedResponse.text();
      const selectedBlobUrl=URL.createObjectURL(new Blob([selectedScript],{type:"text/plain;charset=utf-8"}));
      const nativeXhrOpen=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(method,url,...rest){
        const requestUrl=new URL(String(url),location.href).href;
        return nativeXhrOpen.call(this,method,requestUrl===startUrl?selectedBlobUrl:url,...rest);
      };
      window.fetch=(input,init)=>{
        const requestUrl=new URL(typeof input==="string"?input:input.url,location.href).href;
        if(requestUrl===startUrl)return Promise.resolve(new Response(selectedScript,{status:200,headers:{"content-type":"text/plain;charset=utf-8"}}));
        return nativeFetch(input,init);
      };
      window.__GAL_BLOG_LAUNCH__={projectId:"project_lonely_sea_chapter_one",startScene:launch.scenePath,gameDir:"./game/"};
      window.__TUANCHAT_WEBGAL__={autoStart:true,startScene:launch.scenePath,gameDir:"./game/"};
      const engine=await import("./vendor/webgal/assets/index-BuN51U1e.js");
      await window.GalBlogBridgeV1.attachWebGAL(engine.W,{deferReady:true});
      window.__GAL_BLOG_RUNTIME_ATTACHED_RESOLVE__?.();
      delete window.__GAL_BLOG_RUNTIME_ATTACHED_RESOLVE__;
      await window.__GAL_BLOG_STORY_STARTED__;
      window.GalBlogBridgeV1.storyReady();
      await import("./game/extensions/entry.js");
      status?.remove();
    } catch(error) { if(status) status.textContent="WEBGAL LOAD ERROR · "+(error?.message||String(error)); console.error("[Gal Blog Runtime]",error); }
