<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型索引 — 孤独之海</title>
<style>
:root {
  --ink: #e6eef2; --muted: #9db2bb; --faint: rgba(159,187,198,.42);
  --line: rgba(150,185,198,.16); --line-strong: rgba(150,185,198,.34);
  --accent: #8fb6c6;
  --mincho: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif SC", "Songti SC", serif;
  --latin: Baskerville, "Iowan Old Style", "Palatino Linotype", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; display: grid; place-items: center;
  background: linear-gradient(180deg, #03080c, #0a161d 50%, #04090d);
  color: var(--ink); font-family: var(--mincho);
}
a { color: inherit; text-decoration: none; }
main { width: min(42rem, calc(100vw - 3rem)); padding: 4rem 0; }
header { margin-bottom: 3.5rem; }
header small { font-family: var(--latin); font-size: .62rem; letter-spacing: .5em; color: var(--faint); }
header h1 { margin-top: .9rem; font-size: 2rem; font-weight: 600; letter-spacing: .3em; }
header p { margin-top: 1rem; font-size: .82rem; letter-spacing: .14em; color: var(--muted); }
nav { display: grid; gap: 1rem; }
nav a {
  display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 1.4rem;
  padding: 1.4rem 1.6rem; border: 1px solid var(--line);
  transition: border-color .3s, background .3s;
}
nav a:hover { border-color: var(--line-strong); background: rgba(143,182,198,.06); }
nav a small { font-family: var(--latin); font-size: .6rem; letter-spacing: .34em; color: var(--accent); }
nav a strong { font-weight: 600; font-size: 1rem; letter-spacing: .12em; }
nav a span { font-size: .72rem; letter-spacing: .1em; color: var(--muted); }
footer { margin-top: 3.5rem; font-family: var(--latin); font-size: .58rem; letter-spacing: .4em; color: var(--faint); }
</style>
</head>
<body>
<main>
  <header>
    <small>LONELY SEA · PROTOTYPES</small>
    <h1>原型索引</h1>
    <p>独立静态文件,浏览器直接打开即可。不依赖项目构建。</p>
  </header>
  <nav>
    <a href="./article-page.html">
      <small>PAGE</small>
      <strong>文章页原型</strong>
      <span>深度计 · 潮汐注释 · 存档槽</span>
    </a>
    <a href="./option-page.html">
      <small>OPTION</small>
      <strong>环境设定原型</strong>
      <span>16:9 舞台 · 连体铭牌 · 可交互控件</span>
    </a>
  </nav>
  <footer>一处等待被读取的个人档案。</footer>
</main>
</body>
</html>
