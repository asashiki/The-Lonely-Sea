<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>孤独之海 · CG 鉴赏预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090d12;color:#e8edf0;font-family:"Yu Mincho","Songti SC",serif}button{font:inherit}button:focus-visible{outline:2px solid #d4e2ed;outline-offset:3px}.extra-canvas{position:relative;width:100%;height:100%;container-type:size;overflow:hidden}.cg-viewer{opacity:0;visibility:hidden;pointer-events:none}.cg-viewer[aria-hidden="false"]{opacity:1;visibility:visible;pointer-events:auto}.cg-viewer-caption{display:flex;align-items:baseline;margin:0}.cg-viewer-caption small{font-family:sans-serif}.cg-viewer-caption strong{font-weight:400}.preview-cover{max-width:1100px;padding:8vh 5vw;margin:auto}.preview-cover p{color:#a5b3c2;line-height:1.8}.preview-cover h1{font-weight:400;font-size:clamp(26px,4vw,48px);letter-spacing:.12em}.preview-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:40px}.preview-choices button{padding:0;border:0;background:none;color:inherit;cursor:pointer;text-align:left}.preview-choices img{width:100%;aspect-ratio:16/9;object-fit:cover}.preview-choices span{display:block;margin-top:12px;font-size:14px}@media(max-width:600px){.preview-choices{grid-template-columns:1fr;gap:16px}.preview-cover{height:100%;overflow:auto}}
/* A dark projection room. The artwork supplies the colour; controls occupy
   the letterbox, never a floating panel on top of the picture. */
.extra-canvas .cg-viewer {
  --cg-gutter: clamp(16px, 3.5cqw, 64px);
  position: absolute;
  inset: 0;
  z-index: 100;
  background: #090d12;
  color: #e8edf0;
  container-type: size;
  transition: opacity 240ms ease, visibility 240ms;
}
body:has(.cg-viewer[aria-hidden="false"]) .listen-dock { visibility: hidden; pointer-events: none; }
.stage:has(.cg-viewer[aria-hidden="false"]) > :is(#weather-canvas, .weather-veil) { opacity: 0; }

.extra-canvas .cg-viewer-art {
  position: absolute;
  inset: clamp(56px, 9cqh, 90px) var(--cg-gutter) clamp(62px, 11cqh, 108px);
  background: none;
  filter: none;
  transition: inset 260ms cubic-bezier(.22, 1, .36, 1);
}

.cg-viewer-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  cursor: zoom-in;
}

.cg-viewer img[hidden], .cg-viewer [hidden] { display: none !important; }

.cg-theater-header, .cg-theater-footer {
  position: absolute;
  inset-inline: var(--cg-gutter);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.cg-theater-header { top: max(8px, env(safe-area-inset-top)); height: clamp(44px, 8cqh, 80px); }
.cg-theater-header > div { display: flex; gap: clamp(8px, 1.5cqw, 28px); }
.cg-theater-header p { margin: 0; color: #a5b3c2; font: 500 10px/1.5 "Yu Gothic", sans-serif; letter-spacing: .24em; }
.cg-theater-header p span { margin-inline: 12px; color: #627182; }
.cg-viewer button { touch-action: manipulation; }
.cg-theater-header button, .cg-theater-return, .cg-theater-status button {
  min-height: 44px;
  padding: 8px 4px;
  border: 0;
  color: #c3ccd5;
  background: transparent;
  font: 400 clamp(12px, 1cqw, 16px)/1.4 "Yu Mincho", "Songti SC", serif;
  letter-spacing: .12em;
  cursor: pointer;
}
.cg-theater-header button:hover, .cg-theater-header button[aria-expanded="true"] { color: #fff; }
.cg-viewer button:focus-visible { outline: 2px solid #d4e2ed; outline-offset: 3px; }
.cg-theater-footer { bottom: max(12px, env(safe-area-inset-bottom)); min-height: clamp(42px, 8cqh, 76px); }
.extra-canvas .cg-theater-footer .cg-viewer-caption { position: static; gap: 14px; flex-wrap: wrap; }
.extra-canvas .cg-theater-footer .cg-viewer-caption small { color: #a5b3c2; font-size: 11px; font-variant-numeric: tabular-nums; }
.extra-canvas .cg-theater-footer .cg-viewer-caption strong { color: #e8edf0; font-size: clamp(13px, 1.25cqw, 21px); }
.cg-theater-footer > small { color: #a5b3c2; font: 400 11px/1.6 "Yu Gothic", sans-serif; }
.cg-theater-prev, .cg-theater-next {
  position: absolute;
  top: 50%;
  width: max(44px, var(--cg-gutter));
  height: max(60px, 12cqh);
  padding: 0;
  border: 0;
  color: #d4dee7;
  background: transparent;
  font: 300 clamp(30px, 3cqw, 50px)/1 serif;
  transform: translateY(-50%);
  cursor: pointer;
}
.cg-theater-prev { left: 0; }
.cg-theater-next { right: 0; }
.cg-theater-prev:hover, .cg-theater-next:hover { color: #fff; background: #ffffff08; }

.cg-theater-index {
  position: absolute;
  inset-inline: var(--cg-gutter);
  bottom: clamp(64px, 11cqh, 108px);
  display: flex;
  align-items: center;
  gap: 10px;
  height: clamp(64px, 11cqh, 110px);
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-width: thin;
  scrollbar-color: #778899 #111922;
  padding: 6px 2px;
  scroll-snap-type: x proximity;
}
.cg-theater-index button {
  position: relative;
  flex: 0 0 auto;
  height: calc(100% - 8px);
  aspect-ratio: 16 / 9;
  min-height: 44px;
  padding: 0;
  border: 0;
  background: #1c2733;
  color: #fff;
  opacity: .5;
  transform: scale(.94);
  transition: opacity 140ms, transform 180ms;
  scroll-snap-align: center;
  cursor: pointer;
}
.cg-theater-index button:is(:hover, :focus-visible, [aria-pressed="true"]) { opacity: 1; transform: scale(1); }
.cg-theater-thumb { display: block; width: 100%; height: 100%; background-position: center; background-size: cover; }
.cg-theater-number { position: absolute; left: 4px; bottom: 4px; padding: 2px 5px; background: #090d12d9; font: 500 10px/1.3 "Yu Gothic", sans-serif; }
.extra-canvas .cg-viewer.has-index .cg-viewer-art { bottom: clamp(140px, 24cqh, 230px); }
.cg-theater-controls, .cg-theater-index { transition: opacity 180ms, visibility 180ms; }
.cg-viewer.is-clean :is(.cg-theater-controls, .cg-theater-index) { opacity: 0; visibility: hidden; pointer-events: none; }
.extra-canvas .cg-viewer.is-clean .cg-viewer-art { inset: 0; }
.cg-viewer.is-clean img { cursor: zoom-out; }
.extra-canvas .cg-viewer > button.cg-theater-return {
  position: absolute;
  inset: auto max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) auto;
  width: auto;
  height: auto;
  min-height: 44px;
  padding: 10px 16px;
  background: #090d12dd;
  color: #e8edf0;
  font: 400 12px/1.5 "Yu Gothic", sans-serif;
  transform: none;
  opacity: .72;
}
.extra-canvas .cg-viewer > button.cg-theater-return:is(:hover, :focus-visible) { opacity: 1; }
.cg-theater-status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(28rem, 75%); text-align: center; pointer-events: none; }
.cg-theater-status p:not(:empty) { margin: 0; padding: 14px 20px; color: #e8edf0; background: #090d12ed; font: 400 14px/1.7 "Yu Gothic", sans-serif; }
.cg-theater-status button { pointer-events: auto; background: #090d12ed; padding: 12px 24px; }
@media (max-width: 650px) {
  .cg-theater-header p, .cg-theater-footer > small { display: none; }
  .cg-theater-header, .cg-theater-footer { gap: 8px; }
}
@container (max-height: 460px) {
  .cg-theater-footer > small { display: none; }
  .extra-canvas .cg-viewer-art { inset: 48px 44px 48px; }
  .extra-canvas .cg-viewer.has-index .cg-viewer-art { bottom: 116px; }
  .cg-theater-index { bottom: 48px; height: 64px; }
  .cg-theater-header { top: 0; height: 44px; }
  .cg-theater-footer { bottom: 0; min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .extra-canvas .cg-viewer, .cg-viewer *, .cg-viewer *::before { transition: none !important; }
}
html[data-motion="reduced"] .cg-viewer, html[data-motion="reduced"] .cg-viewer * { transition: none !important; }

    </section></main><script>
// One image, one quiet control layer. No autoplay or background rendering loop.
function createCgGallery({ root, items, reduceMotion, language, onView = () => {} }) {
  const q = (selector) => root.querySelector(selector);
  const image = q('[data-cg-image]');
  const tray = q('[data-cg-tray]');
  const indexButton = q('[data-cg-index-toggle]');
  const cleanButton = q('[data-cg-clean]');
  const returnButton = q('[data-cg-return]');
  const closeButton = q('[data-cg-close]');
  const status = q('[data-cg-status]');
  const available = items.map((item, index) => ({ ...item, index })).filter((item) => item.unlocked && item.art);
  const abort = new AbortController();
  const listen = (node, type, fn, options = {}) => node.addEventListener(type, fn, { ...options, signal: abort.signal });
  let current = -1;
  let origin = null;
  let pending = 0;
  let animation = null;
  let siblings = [];
  let expanded = false;
  let clean = false;
  let ready = false;
  const titleOf = (item) => item.titles?.[language()] || item.title;

  function copy() {
    if (language() === 'JA-JP') return { close: '戻る', index: '一覧', clean: '画面のみ', restore: '操作を表示', loading: '画像を読み込み中', error: '画像を読み込めませんでした。別の画像を選ぶか、再試行してください。', retry: '再試行', prev: '前の CG', next: '次の CG', hint: '← → 切替 / H 画面のみ / I 一覧 / Esc 戻る' };
    if (language() === 'EN-US') return { close: 'Back', index: 'Index', clean: 'Hide UI', restore: 'Show controls', loading: 'Loading image', error: 'This image could not load. Choose another image or retry.', retry: 'Retry', prev: 'Previous CG', next: 'Next CG', hint: '← → Browse / H Hide UI / I Index / Esc Back' };
    return { close: '返回', index: '画面索引', clean: '纯画面', restore: '显示操作', loading: '正在读取画面', error: '画面未能载入，可切换其他画面或重试。', retry: '重试', prev: '上一张 CG', next: '下一张 CG', hint: '← → 切换 / H 纯画面 / I 索引 / Esc 返回' };
  }

  function localize() {
    const text = copy();
    closeButton.textContent = text.close;
    indexButton.textContent = text.index;
    cleanButton.textContent = text.clean;
    returnButton.textContent = text.restore;
    q('[data-cg-retry]').textContent = text.retry;
    q('[data-cg-hint]').textContent = text.hint;
    q('[data-cg-direction="-1"]').setAttribute('aria-label', text.prev);
    q('[data-cg-direction="1"]').setAttribute('aria-label', text.next);
    tray.setAttribute('aria-label', text.index);
    root.setAttribute('aria-label', 'CG GALLERY');
  }

  function setIndex(show) {
    expanded = show;
    root.classList.toggle('has-index', show);
    tray.hidden = !show;
    indexButton.setAttribute('aria-expanded', String(show));
    if (!show) return;
    if (!tray.childElementCount) {
      available.forEach((item, position) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.cgPick = String(item.index);
        button.setAttribute('aria-label', `CG ${String(position + 1).padStart(2, '0')} · ${titleOf(item)}`);
        const thumb = document.createElement('span');
        thumb.className = 'cg-theater-thumb';
        thumb.setAttribute('aria-hidden', 'true');
        thumb.style.backgroundImage = `url("${item.thumb || item.art}")`;
        if (item.thumbPosition) {
          thumb.style.backgroundPosition = item.thumbPosition;
          thumb.style.backgroundSize = '500% 400%';
        }
        const number = document.createElement('span');
        number.className = 'cg-theater-number';
        number.textContent = String(position + 1).padStart(2, '0');
        button.append(thumb, number);
        listen(button, 'click', () => open(item.index));
        tray.append(button);
      });
    }
    syncIndex();
  }

  function syncIndex() {
    tray.querySelectorAll('[data-cg-pick]').forEach((button) => {
      const selected = Number(button.dataset.cgPick) === current;
      button.setAttribute('aria-pressed', String(selected));
      if (selected && expanded) button.scrollIntoView?.({ block: 'nearest', inline: 'nearest', behavior: 'instant' });
    });
  }

  function setClean(show) {
    clean = show;
    root.classList.toggle('is-clean', show);
    q('[data-cg-controls]').inert = show;
    tray.inert = show;
    returnButton.hidden = !show;
    (show ? returnButton : cleanButton).focus({ preventScroll: true });
  }

  function isOpen() { return root.getAttribute('aria-hidden') === 'false'; }

  async function open(index, trigger = null) {
    const item = available.find((entry) => entry.index === index);
    if (!item) return;
    const wasOpen = isOpen();
    if (!wasOpen) {
      origin = trigger || document.activeElement;
      siblings = [];
      // Isolate the complete modal path, including the persistent music dock.
      for (let branch = root; branch.parentElement; branch = branch.parentElement) {
        if (branch === document.body) break;
        [...branch.parentElement.children].filter((node) => node !== branch && !node.matches('script, style, link')).forEach((node) => siblings.push([node, node.inert]));
      }
      siblings.forEach(([node]) => { node.inert = true; });
      root.setAttribute('aria-hidden', 'false');
      root.inert = false;
      root.focus({ preventScroll: true });
    }
    current = index;
    const token = ++pending;
    animation?.cancel();
    localize();
    root.setAttribute('aria-busy', 'true');
    q('[data-cg-retry]').hidden = true;
    status.textContent = copy().loading;
    // Keep the previous picture until the next is decoded, avoiding a white/black flash.
    const incoming = new Image();
    incoming.src = item.art;
    try {
      await incoming.decode();
      if (token !== pending || !isOpen()) return;
      image.src = item.art;
      image.alt = titleOf(item);
      image.hidden = false;
      ready = true;
      root.dataset.cgReady = 'true';
      q('#cg-viewer-index').textContent = `CG ${String(available.indexOf(item) + 1).padStart(2, '0')} / ${String(available.length).padStart(2, '0')}`;
      q('#cg-viewer-title').textContent = titleOf(item);
      status.textContent = '';
      root.setAttribute('aria-busy', 'false');
      syncIndex();
      onView(index);
      if (!reduceMotion() && image.animate) {
        animation = image.animate([{ opacity: .25, transform: 'scale(1.012)' }, { opacity: 1, transform: 'scale(1)' }], { duration: wasOpen ? 220 : 360, easing: 'cubic-bezier(.22,1,.36,1)' });
      }
    } catch {
      if (token !== pending || !isOpen()) return;
      root.setAttribute('aria-busy', 'false');
      status.textContent = copy().error;
      q('[data-cg-retry]').hidden = false;
      if (!ready) image.hidden = true;
    }
  }

  function move(direction) {
    if (!isOpen() || !available.length) return;
    const position = available.findIndex((item) => item.index === current);
    open(available[(position + direction + available.length) % available.length].index);
  }

  function close({ restoreFocus = true } = {}) {
    if (!isOpen()) return false;
    pending += 1;
    animation?.cancel();
    root.setAttribute('aria-hidden', 'true');
    root.setAttribute('aria-busy', 'false');
    root.inert = true;
    siblings.forEach(([node, inert]) => { node.inert = inert; });
    siblings = [];
    clean = false;
    root.classList.remove('is-clean');
    q('[data-cg-controls]').inert = false;
    tray.inert = false;
    returnButton.hidden = true;
    status.textContent = '';
    if (restoreFocus && origin?.isConnected) origin.focus({ preventScroll: true });
    origin = null;
    return true;
  }

  listen(closeButton, 'click', () => close());
  listen(indexButton, 'click', () => setIndex(!expanded));
  listen(cleanButton, 'click', () => setClean(true));
  listen(returnButton, 'click', () => setClean(false));
  listen(image, 'click', () => setClean(!clean));
  listen(q('[data-cg-retry]'), 'click', () => open(current));
  root.querySelectorAll('[data-cg-direction]').forEach((button) => listen(button, 'click', () => move(Number(button.dataset.cgDirection))));
  // Capture within the viewer before the shared EXTRA page shortcuts handle the key.
  listen(root, 'keydown', (event) => {
    if (!isOpen() || event.ctrlKey || event.metaKey || event.altKey) return;
    const key = event.key.toLowerCase();
    if (['escape', 'arrowleft', 'arrowright', 'h', 'i', 'home', 'end'].includes(key)) {
      event.preventDefault();
      event.stopPropagation();
      if (key === 'escape') clean ? setClean(false) : close();
      else if (key === 'h') setClean(!clean);
      else if (key === 'i') { if (clean) setClean(false); setIndex(!expanded); }
      else if (key === 'home') open(available[0]?.index);
      else if (key === 'end') open(available.at(-1)?.index);
      else move(key === 'arrowleft' ? -1 : 1);
    }
    if (key === 'tab') {
      const controls = [...root.querySelectorAll('button')].filter((button) => !button.disabled && !button.closest('[hidden], [inert]'));
      const first = controls[0], last = controls.at(-1);
      if (event.shiftKey && (document.activeElement === first || document.activeElement === root)) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && (document.activeElement === last || document.activeElement === root)) { event.preventDefault(); first?.focus(); }
    }
  });
  listen(window, 'lonely-sea:preferences-change', () => { localize(); if (reduceMotion()) animation?.cancel(); });
  root.inert = true;
  return { open, move, close, isOpen, destroy() { close({ restoreFocus: false }); abort.abort(); } };
